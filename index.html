<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ระบบจัดการ OT</title>
  
  <!-- ⭐⭐⭐ ไอคอนจาก GitHub Pages (ขึ้น 100%) ⭐⭐⭐ -->
  <link rel="apple-touch-icon" href="https://eid47.github.io/ot-app/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OT App">
  <meta name="theme-color" content="#0866D9">
  
  <style>
    * { box-sizing: border-box; }
    html, body { 
      margin: 0; padding: 0; 
      width: 100%; height: 100%; 
      overflow: hidden; 
      background: #f4f7f6;
      font-family: sans-serif;
    }
    /* ⭐ iframe เต็มจอ (ซ่อน scrollbar) */
    #appFrame { 
      width: 100vw; 
      height: 100vh; 
      border: 0; 
      display: block;
    }
    /* ⭐ Loading overlay */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f4f7f6;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid #e0e0e0;
      border-top-color: #0866D9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #333; font-size: 16px; }
  </style>
</head>
<body>
  <!-- Loading ก่อน iframe พร้อม -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">⏳ กำลังโหลดระบบ...</div>
  </div>
  
  <!-- ⭐⭐⭐ iframe ฝัง Apps Script (ห้าม Redirect) ⭐⭐⭐ -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzMt_NF6mW7gTa729ZlgJ9zNdQ7ib74Tzwi7in8SXKJRBK-fcQShM7PhR5_xsnyeGC-/exec"
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
  
  <script>
    var frame = document.getElementById('appFrame');
    var overlay = document.getElementById('loadingOverlay');
    var loaded = false;
    
    // ซ่อน loading เมื่อ iframe โหลดเสร็จ
    frame.onload = function() {
      loaded = true;
      overlay.style.opacity = '0';
      setTimeout(function() { overlay.style.display = 'none'; }, 300);
    };
    
    // Fallback: ถ้าโหลดช้าเกิน 10s ก็ซ่อน loading
    setTimeout(function() {
      if (!loaded) overlay.style.display = 'none';
    }, 10000);
  </script>
</body>
</html>
